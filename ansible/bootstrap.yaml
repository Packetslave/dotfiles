# Entry point for every machine — cross-platform setup (symlinks, oh-my-zsh)
# lives here, then the OS-specific playbook (macos.yaml / linux.yaml) is
# imported based on the detected platform.
#
# Manual run on macOS (mac-setup.sh does all of this for you):
#   OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES OS_ACTIVITY_MODE=disable \
#       ansible-playbook ansible/bootstrap.yaml
# The env vars work around macOS's fork-safety crash in Ansible's forked
# workers. On Linux a plain `ansible-playbook ansible/bootstrap.yaml` works.
- name: Bootstrap development environment
  hosts: localhost
  connection: local

  vars:
    # Whose published SSH keys authorize this machine (see the ssh_keys task).
    github_user: Packetslave

    # Formulae needed on every platform — Homebrew is the package manager on
    # macOS and Linux alike (mac-setup.sh / linux-setup.sh install it before
    # this playbook runs). macOS-only formulae stay in macos.yaml.
    homebrew_common_formulae:
      - age
      - atuin
      - bat
      - beads
      - btop
      - caddy
      - cmark-gfm
      - eza
      - fd
      - fzf
      - gh
      - git
      - git-delta
      - golangci-lint
      - jq # claude/statusline.sh parses JSON with it
      - librsvg # rsvg-convert, the SVG->PNG/PDF render path
      - mosh
      - neovim
      - node # .mcp.json launches node; instapaper-mcp build needs npm
      - opentofu
      - powerlevel10k
      - ripgrep
      - shellcheck
      - sops
      - starship
      - tig
      - tmux
      - trufflehog
      - uv
      - yq
      - zoxide
    # Casks are not macOS-only under Homebrew 6: claude-code resolves per
    # platform (linux-x64 / darwin-arm64) and community.general.homebrew_cask
    # runs on Linux. macOS-only casks stay in macos.yaml.
    homebrew_common_casks:
      - claude-code
    homebrew_prefix: >-
      {{ '/opt/homebrew' if ansible_facts['system'] == 'Darwin'
         else '/home/linuxbrew/.linuxbrew' }}

  tasks:
    # `always`, because four later tasks gate on this fact and a tag-limited
    # run (--tags ssh_keys) would otherwise skip the stat and then fail on
    # "'reddit_machine' is undefined".
    - name: Check for a Reddit-managed machine
      ansible.builtin.stat:
        path: /opt/reddit
      register: reddit_machine
      tags: [always]

    # authorized_keys is localhost convergence, so it belongs here and not in
    # homelab. Push cannot solve this: the host you cannot SSH into is exactly
    # the host you cannot hand a key to. On 2026-08-25 mfa1's key was already
    # published, and lunchbox still refused it — the only way to authorize
    # mfa1 on lunchbox was to SSH to lunchbox. Pulling here lets a machine
    # bootstrap its own trust, with no inventory and no reachability.
    #
    # github.com/<user>.keys is the source of truth, the same endpoint
    # homelab's workstations.yaml and webserver.yaml use for the hosts that
    # never run these dotfiles. Publish a new machine's key once
    # (`gh ssh-key add ~/.ssh/id_ed25519.pub --title "<host> (<date>)"`) and
    # every machine picks it up on its next converge:
    #
    #   ansible-playbook ~/dotfiles/ansible/bootstrap.yaml --tags ssh_keys
    #
    # Additive, matching its homelab siblings: hosts carry Termius, Working
    # Copy and deploy keys that were never on GitHub, and exclusive mode would
    # delete them. The cost is that removing a key from GitHub removes it from
    # nowhere — revocation is still a manual, per-host job.
    #
    # Never on a Reddit-managed machine: the personal fleet's keys have no
    # business authorizing anything on an employer-managed device.
    - name: Install the admin SSH keys from GitHub
      ansible.posix.authorized_key:
        user: "{{ ansible_facts['user_id'] }}"
        key: "https://github.com/{{ github_user }}.keys"
        state: present
      when: not reddit_machine.stat.exists
      tags: [ssh_keys]
    - name: Create links - tmux dir
      ansible.builtin.file:
        path: ~/.tmux
        state: directory
    - name: Create links - tmux conf
      ansible.builtin.file:
        src: ~/dotfiles/tmux/tmux.conf
        dest: ~/.tmux.conf
        state: link
    - name: Create links - tmuxline
      ansible.builtin.file:
        src: ~/dotfiles/tmux/tmuxline
        dest: ~/.tmuxline
        state: link
    - name: Create links - tmux plugins
      ansible.builtin.file:
        src: ~/dotfiles/tmux/plugins
        dest: ~/.tmux/plugins
        state: link

    - name: check the current emacs.d symlink
      stat: path=~/.emacs.d
      register: emacsd_available

    - name: remove the emacs.d folder (only if it is a folder)
      file:
        path: ~/.emacs.d
        state: absent
      when: emacsd_available.stat.isdir is defined and emacsd_available.stat.isdir

    - name: Create links - emacs dir
      ansible.builtin.file:
        path: ~/.emacs.d
        state: link
        src: ~/dotfiles/emacs/emacs.d

    - name: Create links - tmuxinator dir
      ansible.builtin.file:
        path: ~/.tmuxinator
        state: directory
    - name: Create links - tmuxinator configs
      ansible.builtin.file:
        src: ~/dotfiles/tmuxinator/proxy.yml
        dest: ~/.tmuxinator/proxy.yml
        state: link

    - name: Create links - config dir
      ansible.builtin.file:
        path: ~/.config/atuin
        state: directory
    - name: Create links - atuin configs
      ansible.builtin.file:
        src: ~/dotfiles/atuin/config.toml
        dest: ~/.config/atuin/config.toml
        state: link
        force: true

    - name: Create links - dig configs
      ansible.builtin.file:
        src: ~/dotfiles/dig/digrc
        dest: ~/.digrc
        state: link

    - name: Create links - eza configs
      ansible.builtin.file:
        src: ~/dotfiles/eza
        dest: ~/.config/eza
        state: link

    # Opts in to yt-dlp's EJS challenge solver (needs deno) — without it
    # YouTube downloads 403 since the 2026 "n challenge" changes
    - name: Create links - yt-dlp config dir
      ansible.builtin.file:
        path: ~/.config/yt-dlp
        state: directory
    - name: Create links - yt-dlp config
      ansible.builtin.file:
        src: ~/dotfiles/yt-dlp/config
        dest: ~/.config/yt-dlp/config
        state: link
        force: true

    - name: Create links - ghostty config dir
      ansible.builtin.file:
        path: ~/.config/ghostty
        state: directory

    - name: Create links - ghostty configs
      ansible.builtin.file:
        src: ~/dotfiles/ghostty/config
        dest: ~/.config/ghostty/config
        state: link
        force: true

    - name: Create links - wezterm config
      ansible.builtin.file:
        src: ~/dotfiles/wezterm.lua
        dest: ~/.wezterm.lua
        state: link
        force: true

    - name: Create links - starship config
      ansible.builtin.file:
        src: ~/dotfiles/starship.toml
        dest: ~/.config/starship.toml
        state: link
        force: true

    # zshrc sources oh-my-zsh from ~/src/external — cloned here rather than
    # via the official curl|sh installer, which tries to take over ~/.zshrc
    # (dotfiles-managed symlink). Re-runs update it to the latest master.
    - name: Create links - external src dir
      ansible.builtin.file:
        path: ~/src/external
        state: directory
    - name: Install oh-my-zsh
      ansible.builtin.git:
        repo: https://github.com/ohmyzsh/ohmyzsh.git
        dest: ~/src/external/oh-my-zsh
        depth: 1

    - name: Create links - zsh config
      ansible.builtin.file:
        src: ~/dotfiles/zsh/zshrc
        dest: ~/.zshrc
        state: link

    # zshrc covers interactive shells only, so `ssh host <command>` (which is
    # how mosh starts mosh-server) never saw the Homebrew prefix. zshenv is the
    # one startup file zsh reads for non-interactive shells too.
    # force, because studio carries a hand-written ~/.zshenv that predates this
    # task; without it ansible refuses to convert a file into a link. That
    # file's only content was cargo's env script, which zshenv now sources.
    - name: Create links - zsh env
      ansible.builtin.file:
        src: ~/dotfiles/zsh/zshenv
        dest: ~/.zshenv
        state: link
        force: true

    - name: Create links - p10k config
      ansible.builtin.file:
        src: ~/dotfiles/zsh/p10k.zsh
        dest: ~/.p10k.zsh
        state: link

    # Rendered, not linked, despite the neighbours: the template branches on
    # reddit_machine and on the platform.
    - name: Render gitconfig
      ansible.builtin.template:
        src: ~/dotfiles/gitconfig/gitconfig
        dest: ~/.gitconfig

    # Claude tooling is not allowed on Reddit-managed machines
    - name: Create links - claude dir
      ansible.builtin.file:
        path: ~/.claude
        state: directory
      when: not reddit_machine.stat.exists
    - name: Create links - claude statusline
      ansible.builtin.file:
        src: ~/dotfiles/claude/statusline.sh
        dest: ~/.claude/statusline.sh
        state: link
        force: true
      when: not reddit_machine.stat.exists

    - name: Install cross-platform packages with homebrew
      community.general.homebrew:
        name: "{{ homebrew_common_formulae }}"
        state: present

    # Reddit-managed machines deliberately skip Claude tooling, same gate as
    # macos.yaml's claude_casks filter. No install_options: adopt here — that
    # takes over an app already in /Applications, which means nothing on Linux.
    - name: Install cross-platform casks with homebrew
      when: not reddit_machine.stat.exists
      community.general.homebrew_cask:
        name: "{{ homebrew_common_casks }}"
        state: present

    # Local web server on :2015 (see configs/README.md in the cowork repo).
    # The canonical Caddyfile template lives in cowork, so these tasks are
    # skipped until that repo has been cloned (mac-setup.sh does the clone).
    - name: Check for the canonical Caddyfile template in the cowork repo
      ansible.builtin.stat:
        path: "{{ ansible_facts.env.HOME }}/src/cowork/configs/Caddyfile.j2"
      register: cowork_caddyfile

    - name: Install the canonical Caddyfile
      when: cowork_caddyfile.stat.exists
      ansible.builtin.template:
        src: "{{ cowork_caddyfile.stat.path }}"
        dest: "{{ homebrew_prefix }}/etc/Caddyfile"
        mode: "0644"
        # --adapter is required: the validation temp file isn't named
        # "Caddyfile", so caddy would otherwise assume JSON config
        validate: "{{ homebrew_prefix }}/bin/caddy validate --adapter caddyfile --config %s"
      vars:
        # root must be a literal absolute path — brew services overrides HOME,
        # so a {$HOME} placeholder in the Caddyfile would resolve wrong
        cowork_root: "{{ ansible_facts.env.HOME }}/src/cowork"
      notify: Restart Caddy

    - name: Check whether caddy is running as a brew service
      when: cowork_caddyfile.stat.exists
      ansible.builtin.command:
        cmd: "{{ homebrew_prefix }}/bin/brew services info caddy --json"
      register: caddy_service_info
      changed_when: false

    - name: Start caddy as a brew service
      when:
        - cowork_caddyfile.stat.exists
        - not (caddy_service_info.stdout | from_json | first).running
      ansible.builtin.command:
        cmd: "{{ homebrew_prefix }}/bin/brew services start caddy"

  handlers:
    - name: Restart Caddy
      ansible.builtin.command:
        cmd: "{{ homebrew_prefix }}/bin/brew services restart caddy"

- name: Configure macOS
  ansible.builtin.import_playbook: macos.yaml
  when: ansible_facts['system'] == 'Darwin'

- name: Configure Linux
  ansible.builtin.import_playbook: linux.yaml
  when: ansible_facts['system'] == 'Linux'
