# Manual run (mac-setup.sh does all of this for you):
#   OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES OS_ACTIVITY_MODE=disable \
#       ansible-playbook ansible/bootstrap.yaml
# The env vars work around macOS's fork-safety crash in Ansible's forked
# workers. The sudo password is read from the login keychain — seed it once:
#   security add-generic-password -s ansible-sudo -a "$USER" -w
- name: Bootstrap development environment
  hosts: localhost
  connection: local

  # security(1) is built into macOS, so unlike the keyring lookup this needs
  # no pip packages inside Homebrew ansible's private virtualenv
  vars:
    ansible_become_pass: "{{ lookup('pipe', 'security find-generic-password -s ansible-sudo -w') }}"

  tasks:
    - name: Create links - tmux dir
      ansible.builtin.file:
        path: ~/.tmux
        state: directory
    - name: Create links - tmux conf
      ansible.builtin.file:
        src: ~/dotfiles/tmux/tmux.conf
        dest: ~/.tmux.conf
        state: link
    - name: Create links - tmuxline
      ansible.builtin.file:
        src: ~/dotfiles/tmux/tmuxline
        dest: ~/.tmuxline
        state: link
    - name: Create links - tmux plugins
      ansible.builtin.file:
        src: ~/dotfiles/tmux/plugins
        dest: ~/.tmux/plugins
        state: link

    - name: check the current emacs.d symlink
      stat: path=~/.emacs.d
      register: emacsd_available

    - name: remove the emacs.d folder (only if it is a folder)
      file:
        path: ~/.emacs.d
        state: absent
      when: emacsd_available.stat.isdir is defined and emacsd_available.stat.isdir

    - name: Create links - emacs dir
      ansible.builtin.file:
        path: ~/.emacs.d
        state: link
        src: ~/dotfiles/emacs/emacs.d

    - name: Create links - tmuxinator dir
      ansible.builtin.file:
        path: ~/.tmuxinator
        state: directory
    - name: Create links - tmuxinator configs
      ansible.builtin.file:
        src: ~/dotfiles/tmuxinator/proxy.yml
        dest: ~/.tmuxinator/proxy.yml
        state: link

    - name: Create links - config dir
      ansible.builtin.file:
        path: ~/.config/atuin
        state: directory
    - name: Create links - atuin configs
      ansible.builtin.file:
        src: ~/dotfiles/atuin/config.toml
        dest: ~/.config/atuin/config.toml
        state: link
        force: true

    - name: Create links - dig configs
      ansible.builtin.file:
        src: ~/dotfiles/dig/digrc
        dest: ~/.digrc
        state: link

    - name: Create links - eza configs
      ansible.builtin.file:
        src: ~/dotfiles/eza
        dest: ~/.config/eza
        state: link

    - name: Create links - ghostty config dir
      ansible.builtin.file:
        path: ~/.config/ghostty
        state: directory

    - name: Create links - ghostty configs
      ansible.builtin.file:
        src: ~/dotfiles/ghostty/config
        dest: ~/.config/ghostty/config
        state: link
        force: true

    # Karabiner saves karabiner.json via atomic rename, which replaces a file
    # symlink with a regular file — link the whole directory instead
    - name: Create links - karabiner config dir
      ansible.builtin.file:
        src: ~/dotfiles/karabiner
        dest: ~/.config/karabiner
        state: link
        force: true

    - name: Create links - aerospace config
      ansible.builtin.file:
        src: ~/dotfiles/aerospace/aerospace.toml
        dest: ~/.aerospace.toml
        state: link
        force: true

    - name: Create links - wezterm config
      ansible.builtin.file:
        src: ~/dotfiles/wezterm.lua
        dest: ~/.wezterm.lua
        state: link
        force: true

    - name: Create links - starship config
      ansible.builtin.file:
        src: ~/dotfiles/starship.toml
        dest: ~/.config/starship.toml
        state: link
        force: true

    # zshrc sources oh-my-zsh from ~/src/external — cloned here rather than
    # via the official curl|sh installer, which tries to take over ~/.zshrc
    # (dotfiles-managed symlink). Re-runs update it to the latest master.
    - name: Create links - external src dir
      ansible.builtin.file:
        path: ~/src/external
        state: directory
    - name: Install oh-my-zsh
      ansible.builtin.git:
        repo: https://github.com/ohmyzsh/ohmyzsh.git
        dest: ~/src/external/oh-my-zsh
        depth: 1

    - name: Create links - zsh config
      ansible.builtin.file:
        src: ~/dotfiles/zsh/zshrc
        dest: ~/.zshrc
        state: link

    - name: Create links - p10k config
      ansible.builtin.file:
        src: ~/dotfiles/zsh/p10k.zsh
        dest: ~/.p10k.zsh
        state: link

    - name: Create links - gitconfig
      ansible.builtin.template:
        src: ~/dotfiles/gitconfig/gitconfig
        dest: ~/.gitconfig

    - name: Create links - vscode dir
      ansible.builtin.file:
        path: "~/Library/Application Support/Code/User/"
        state: directory
    - name: Create links - vscode
      ansible.builtin.file:
        src: ~/dotfiles/vscode/settings.json
        dest: "~/Library/Application Support/Code/User/settings.json"
        state: link
        force: true
    - name: Create links - vscode keybindings
      ansible.builtin.file:
        src: ~/dotfiles/vscode/keybindings.json
        dest: "~/Library/Application Support/Code/User/keybindings.json"
        state: link
        force: true

    # Homebrew 6 refuses to load formulae/casks from untrusted third-party
    # taps in non-interactive runs — trust them before tapping/installing
    - name: Trust third-party homebrew taps
      ansible.builtin.command:
        argv:
          - brew
          - trust
          - --tap
          - agavra/tap
          - felixkratz/formulae
          - nikitabobko/tap
          - darrylmorley/whatcable
      changed_when: false

    - name: Add homebrew taps
      community.general.homebrew_tap:
        name:
          - agavra/tap
          - darrylmorley/whatcable
          - felixkratz/formulae
          - nikitabobko/tap
        state: present

    # Explicitly installed formulae only (installed_on_request per
    # `brew info --json=v2 --installed`) — dependencies are left to brew
    - name: Install packages with homebrew
      community.general.homebrew:
        name:
          - age
          - age-plugin-se
          - agavra/tap/tuicr
          - ansible
          - atuin
          - bat
          - bat-extras
          - beads
          - btop
          - bun
          - caddy
          - cloc
          - cmark-gfm
          - colima
          - coreutils
          - csvkit
          - docker
          - docker-compose
          - dockutil
          - doggo
          - duti
          - eza
          - fd
          - felixkratz/formulae/borders
          - felixkratz/formulae/sketchybar
          - ffmpeg
          - firebase-cli
          - fzf
          - gh
          - git
          - git-delta
          - git-extras
          - glow
          - go
          - grafanactl
          - grpcurl
          - hugo
          - hunk
          - iperf3
          - jq
          - k9s
          - kubernetes-cli
          - kubetail
          - lazydocker
          - librsvg
          - llama.cpp
          - mactop
          - marp-cli
          - mosh
          - mtr
          - neovim
          - nmap
          - nvm
          - opencode
          - openjdk
          - pam-reattach
          - poppler
          - posting
          - powerlevel10k
          - protoc-gen-go
          - protoc-gen-go-grpc
          - pv
          - pygments
          - rclone
          - rename
          - restic
          - ripgrep
          - rsync
          - rustup
          - sesh
          - shellcheck
          - sops
          - starship
          - stern
          - superfile
          - tfenv
          - tig
          - tmux
          - tmuxinator
          - uv
          - yq
          - yt-dlp
          - zoxide
        state: present

    - name: Install casks with homebrew
      community.general.homebrew_cask:
        name:
          - 1password-cli
          - agentsview
          - alfred
          - claude-code
          - darrylmorley/whatcable/whatcable
          - dropbox
          - font-monaspace-nf
          - gcloud-cli
          - karabiner-elements
          - keyboard-maestro
          - macparakeet
          - nikitabobko/tap/aerospace
          - vlc
          - wezterm@nightly
        state: present
        sudo_password: "{{ ansible_become_pass }}"

    # Touch ID for sudo, update-proof (sudo_local survives macOS updates);
    # pam_reattach makes it work inside tmux/screen, ignore_ssh keeps SSH
    # sessions on the password path
    - name: Enable Touch ID for sudo
      become: true
      ansible.builtin.copy:
        dest: /etc/pam.d/sudo_local
        content: |
          auth       optional       /opt/homebrew/lib/pam/pam_reattach.so ignore_ssh
          auth       sufficient     pam_tid.so
        owner: root
        group: wheel
        mode: "0644"

    # Ctrl+arrow Mission Control/Spaces shortcuts swallow the keys before the
    # terminal sees them, breaking tmux's default pane-resize bindings
    # (32=Mission Control, 33=App windows, 79=prev Space, 81=next Space)
    - name: Disable Ctrl-arrow Mission Control shortcuts
      ansible.builtin.command:
        argv:
          - defaults
          - write
          - com.apple.symbolichotkeys
          - AppleSymbolicHotKeys
          - -dict-add
          - "{{ item }}"
          - "<dict><key>enabled</key><false/></dict>"
      loop: [32, 33, 79, 81]
      changed_when: false

    # Free up cmd-space for Alfred (64=Spotlight search, 65=Finder search window)
    - name: Disable Spotlight keyboard shortcuts
      ansible.builtin.command:
        argv:
          - defaults
          - write
          - com.apple.symbolichotkeys
          - AppleSymbolicHotKeys
          - -dict-add
          - "{{ item }}"
          - "<dict><key>enabled</key><false/></dict>"
      loop: [64, 65]
      changed_when: false

    - name: Activate hotkey changes
      ansible.builtin.command:
        cmd: /System/Library/PrivateFrameworks/SystemAdministration.framework/Resources/activateSettings -u
      changed_when: false

    # Traditional scroll direction: swipe down scrolls the content down.
    # Running apps only pick this up after logout/login.
    - name: Disable natural scrolling
      community.general.osx_defaults:
        domain: NSGlobalDomain
        key: com.apple.swipescrolldirection
        type: bool
        value: false

    - name: Remove all pinned apps from the dock
      community.general.osx_defaults:
        domain: com.apple.dock
        key: persistent-apps
        type: array
        value: []
      notify: Restart Dock

    - name: Enable dock autohide
      community.general.osx_defaults:
        domain: com.apple.dock
        key: autohide
        type: bool
        value: true
      notify: Restart Dock

    - name: Disable suggested and recent apps in the dock
      community.general.osx_defaults:
        domain: com.apple.dock
        key: show-recents
        type: bool
        value: false
      notify: Restart Dock

    # Nlsv = list view (icnv=icon, clmv=column, glyv=gallery)
    - name: Set finder default view to list view
      community.general.osx_defaults:
        domain: com.apple.finder
        key: FXPreferredViewStyle
        type: string
        value: Nlsv
      notify: Restart Finder

    # PfHm = home directory; both keys are needed
    - name: Open new finder windows in the home directory
      community.general.osx_defaults:
        domain: com.apple.finder
        key: "{{ item.key }}"
        type: string
        value: "{{ item.value }}"
      loop:
        - { key: NewWindowTarget, value: PfHm }
        - { key: NewWindowTargetPath, value: "file://{{ ansible_facts.env.HOME }}/" }
      notify: Restart Finder

    - name: Hide recent tags in the finder sidebar
      community.general.osx_defaults:
        domain: com.apple.finder
        key: ShowRecentTags
        type: bool
        value: false
      notify: Restart Finder

  handlers:
    - name: Restart Dock
      ansible.builtin.command:
        cmd: killall Dock

    - name: Restart Finder
      ansible.builtin.command:
        cmd: killall Finder
