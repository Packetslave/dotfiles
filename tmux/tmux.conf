set -g prefix C-'\'   # '
unbind C-b

bind '\' last-window 
bind C-'\' last-window

#set -g @nord_tmux_show_status_content "0"
#set -g status-left "#[fg=black,bg=blue,bold] #S #[fg=blue,bg=black,nobold,noitalics,nounderscore]"

set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tpm'

unbind s
unbind C-s

bind-key "s" run-shell "sesh connect \"$(
    sesh list -tH | fzf-tmux -p 55%,60% \
        --no-sort --border-label ' sesh ' --prompt '⚡  ' \
        --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
        --bind 'tab:down,btab:up' \
        --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list)' \
        --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t)' \
        --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z)' \
        --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
        --bind 'ctrl-d:execute(tmux kill-session -t {})+change-prompt(⚡  )+reload(sesh list)'
)\""

# Pass OSC 8 hyperlinks through to the outer terminal (WezTerm) so links are clickable
set -as terminal-features ',*:hyperlinks'

# Clipboard. Goal: a copy made anywhere -- local tmux, over SSH, or tmux over
# SSH -- lands on the Mac's clipboard. The transport is OSC 52, an in-band
# escape sequence, so it rides the tty through both ssh and tmux; the defaults
# are what block it.
#
#   set-clipboard on   tmux's default `external` sets the outer clipboard for
#                      tmux's OWN copies but ignores OSC 52 from applications
#                      inside a pane -- which is exactly our case.
#   allow-passthrough  Claude Code wraps OSC 52 in a `Ptmux;` DCS when it
#                      detects tmux; tmux 3.3+ silently drops those unless on.
#                      Both are enabled because which one is used depends on
#                      the app's own detection, and they cost nothing together.
#   clipboard feature  guarantees the `Ms` terminfo capability tmux requires
#                      before it will emit the sequence at all.
#
# Trade-off, deliberately accepted: any program running in a pane can now set
# the local clipboard, and passthrough lets it send arbitrary escapes to the
# terminal. This is write-only -- nothing here lets a pane *read* the clipboard.
set -g set-clipboard on
set -g allow-passthrough on
set -as terminal-features ',*:clipboard'

# The options above only cover apps that emit OSC 52 themselves. Claude Code
# does that over bare SSH, but inside tmux it copies with `tmux load-buffer`
# instead (it prefers a native tool, then the tmux buffer, then OSC 52 -- and
# on a headless Linux box there is no native tool). load-buffer fills a tmux
# buffer and stops there, so the text never reaches the Mac. Mirror it onward.
set-hook -g after-load-buffer 'run-shell -b "~/dotfiles/tmux/osc52-copy.sh"'

# Mouse scrolling. Without `mouse on`, tmux leaves the wheel to the outer
# terminal, which only ever scrolls its own (useless) scrollback -- apps that
# ask for mouse reporting themselves (Claude Code, htop) worked anyway, nothing
# else did.
#
# `mouse on` alone is not enough: tmux's stock wheel binding forwards raw mouse
# events to any alternate-screen pane, and an app that never asked for mouse
# reporting (less, man, git's pager) just drops them. So dispatch on what the
# pane actually wants, checking mouse_any_flag BEFORE alternate_on -- a
# full-screen app that requested mouse is both, and must get the raw events:
#
#   requested mouse / already in copy-mode -> forward it (send -M)
#   alternate screen, no mouse             -> synthesize arrow keys
#   primary screen (bare shell)            -> tmux copy-mode scrollback
#
# This is also what makes nesting work: an inner tmux with `mouse on` sets
# mouse mode on its tty, so the outer one sees mouse_any_flag and forwards --
# verified over SSH in both directions, which is why this lives in the shared
# conf rather than a per-host one.
set -g mouse on
bind -n WheelUpPane   if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send -M } { if -F "#{alternate_on}" { send -N3 Up }   { copy-mode -e } }
bind -n WheelDownPane if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send -M } { if -F "#{alternate_on}" { send -N3 Down } { copy-mode -e } }

setw -g automatic-rename
set  -g base-index 1
set  -g display-time 1000
setw -g monitor-activity on
setw -g pane-base-index 1
set  -g renumber-windows on
set  -g status-position top
set  -g visual-activity on

bind b break-pane -t :
bind c new-window -c '#{pane_current_path}'
bind t choose-tree
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
bind C-b send-keys 'tat && exit' 'C-m'

bind S command-prompt -p "Name of session: " "new-session -s '%%'"

# Kill sessions
bind-key K run-shell 'tmux switch-client -n \; kill-session -t "$(tmux display-message -p "#S")" || tmux kill-session'

# Reload
bind-key r source-file $HOME/.tmux.conf \; display-message "Reloaded!"

# Logging
bind-key P pipe-pane -o "cat >>$HOME/tmp/#W-/usr/local/tmux/bin/tmux.log" \; display-message "Toggled logging to $HOME/tmp/#W-/usr/local/tmux/bin/tmux.log"

# Fuzzy windows
bind C-w choose-window
bind w split-window -v "tmux list-windows | awk '{print $2}' | tr -d '*-#' | grep -v $(tmux display-message -p '#W') | fzf --tac | xargs tmux select-window -t"

# Zoom pane
bind-key Z resize-pane -Z \; display-message "Zoom zoom zoom"

# Resize panes: Shift+arrows (repeatable). The default C-arrow bindings are
# useless on macOS — Mission Control/Spaces swallow Ctrl+arrows system-wide
bind -r S-Left  resize-pane -L 5
bind -r S-Down  resize-pane -D 5
bind -r S-Up    resize-pane -U 5
bind -r S-Right resize-pane -R 5

# --- Tokyo Night status line (replaces nord-tmux) ---
set -g status-style "fg=#a9b1d6,bg=#24283b"
set -g status-left-length 30
set -g status-left "#[fg=#16161e,bg=#7aa2f7,bold] #S #[fg=#7aa2f7,bg=#24283b,nobold]"
setw -g window-status-separator ""
setw -g window-status-format "#[fg=#737aa2,bg=#24283b]  #I #W#F "
setw -g window-status-current-format "#[fg=#24283b,bg=#3b4261]#[fg=#7dcfff,bg=#3b4261,bold] #I #W#F #[fg=#3b4261,bg=#24283b]"
setw -g window-status-activity-style "fg=#e0af68,bg=#24283b"
set -g status-right "#{prefix_highlight}#[fg=#7aa2f7,bg=#24283b]#[fg=#16161e,bg=#7aa2f7,bold] #H "
set -g @prefix_highlight_fg '#16161e'
set -g @prefix_highlight_bg '#e0af68'
set -g pane-border-style "fg=#292e42"
set -g pane-active-border-style "fg=#7aa2f7"
set -g message-style "fg=#c0caf5,bg=#292e42"
set -g mode-style "fg=#c0caf5,bg=#3b4261"
set -g display-panes-active-colour "#7aa2f7"
set -g display-panes-colour "#565f89"
set -g clock-mode-colour "#7aa2f7"

unbind '\'
bind '\' last-window

# Keep last: TPM must run AFTER status-right is set, because prefix-highlight
# rewrites status-right in place (a later overwrite kills the indicator)
run '~/.tmux/plugins/tpm/tpm'
